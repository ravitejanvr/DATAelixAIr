name: Provision Parity Test User

# One-off / re-runnable manual job: signs up (or confirms already exists)
# the dedicated CI test account that parity-check.yml signs in as, so its
# edge-function calls carry a real user JWT instead of just the anon key.
#
# Uses a plain public signUp() with the anon key — Lovable Cloud does not
# expose SUPABASE_SERVICE_ROLE_KEY at all, and this project requires email
# confirmation, so a human has to click the confirmation link sent to the
# real inbox behind PARITY_TEST_EMAIL. See scripts/provision-parity-test-user.mjs
# for the full story.
#
# workflow_dispatch only — this creates/modifies a real auth user, not
# something to run on every push.

on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Provision CI parity test user
        run: node scripts/provision-parity-test-user.mjs
        env:
          PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}
