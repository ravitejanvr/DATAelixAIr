name: Provision Parity Test User

# One-off / re-runnable manual job: creates (or re-confirms) the dedicated
# CI test account that parity-check.yml signs in as, so its edge-function
# calls carry a real user JWT instead of just the anon key. Uses the Admin
# API with the service role key — never exposed outside this job, never
# used by parity-check.yml itself (which only ever gets the resulting
# email/password, not this key).
#
# workflow_dispatch only. This creates/modifies a real auth user and
# assigns it an elevated role (doctor) — not something to run on every push.

on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Provision CI parity test user
        run: node scripts/provision-parity-test-user.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}
