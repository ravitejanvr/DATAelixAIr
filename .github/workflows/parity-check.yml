name: O1/O2 Parity Check

# Runs the opt-in O1 (production orchestrator) vs O2 (benchmark_mode) parity
# contract test against LIVE Supabase edge functions. This is the check that
# would have caught the benchmark-mode diagnosis-name bug directly, and the
# one flagged as "opt-in and never actually run" during the review that found
# it — this workflow exists so that stops being true.
#
# UPDATE (2026-09-20): also runs the V4-bridge live parity test
# (v4_bridge_live_parity.test.ts). Same live-edge-function requirement, same
# CI test user, so it reuses this job rather than duplicating the
# reachability probe + sign-in infrastructure in a second workflow. It checks
# a different thing than the name implies (cockpit vs conversational bridge
# fidelity, not O1 vs O2 engine parity, ROADMAP item 24) — kept in this
# workflow deliberately, not renamed, given how fragile getting this required
# check wired up correctly already proved below.
#
# CONFIRMED (2026-09-18, runs #1-2 on this workflow): GitHub-hosted runners
# DO reach mhqdqilzkqvbgtygtlab.supabase.co — a raw probe got a real HTTP
# response in <1s, not a connection failure. So this runs automatically on
# PRs touching the files it covers.
#
# UPDATE (2026-09-18): the missing authenticated session is now wired in —
# this job signs in as a dedicated CI test user (doctor role; see
# scripts/provision-parity-test-user.mjs) before running the test, via the
# PARITY_TEST_PASSWORD secret. A real green run was watched (see #1) and
# this is now a required check on main.
#
# UPDATE (2026-09-18, same day): promoting this to required immediately
# surfaced a gap — PR #17 touched several supabase/functions/ files (the
# UUID-guard and service-role-credential fixes from #15/#16) but this
# workflow's path filter didn't include supabase/functions/**, so it never
# triggered, and the PR sat permanently blocked waiting on a required check
# that would never run. Widening the filter to include supabase/functions/**
# only moved the same problem: PR #18 (a one-line ROADMAP.md edit) hit it
# again. GitHub's required-status-check gate needs a check-run reported
# through the PR's own pull_request-triggered check-suite specifically — a
# workflow_dispatch run against the same commit does NOT satisfy it, even
# though it shows up as a matching check-run (confirmed: merge attempt
# still 405'd with "Required status check 'parity' is expected" after a
# manually dispatched run succeeded on that exact SHA). Any path filter,
# however wide, leaves this gap for whatever it excludes. Dropped path
# filtering entirely below — parity now runs on every PR, not just ones
# touching specific files, so the required check always fires correctly.

on:
  workflow_dispatch: {}
  pull_request: {}

jobs:
  reachability-probe:
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
    steps:
      - name: Probe Supabase edge function egress
        id: probe
        run: |
          set +e
          STATUS=$(curl -s -o /tmp/probe_body.txt -w "%{http_code}" \
            --max-time 15 \
            "https://mhqdqilzkqvbgtygtlab.supabase.co/functions/v1/ddx-engine" \
            -H "Content-Type: application/json" -d '{}')
          CURL_EXIT=$?
          echo "curl exit code: $CURL_EXIT, http status: $STATUS"
          cat /tmp/probe_body.txt
          # A connection-level failure (DNS/timeout/refused) means this runner
          # has no egress at all. Any HTTP response — even 401/403/500 — means
          # the network path exists and only auth/payload need sorting out.
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          fi

  parity:
    needs: reachability-probe
    if: needs.reachability-probe.outputs.reachable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: O1/O2 parity (live edge functions)
        run: RUN_PARITY_CHECK=1 npx vitest run src/tests/contract/benchmark_parity.test.ts
        env:
          PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}

      - name: V4 bridge live parity (live edge functions)
        run: RUN_PARITY_CHECK=1 npx vitest run src/tests/contract/v4_bridge_live_parity.test.ts
        env:
          PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}
